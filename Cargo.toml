[package]
name = "anima-core-uplift"
version = "2.0.0"
edition = "2021"
authors = ["Borealis S. Hedling"]
description = "Zero-float Q32.32 symplectic runtime, CSR Lie commutator, and Ed25519 replay envelope for Project Anima V2.0."
license = "LicenseRef-Anima-NonCommercial-TriLicense"
publish = false

[lib]
name = "anima_core_uplift"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
